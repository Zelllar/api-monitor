services:
  postgres:
    image: postgres:18
    container_name: api-monitor-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: api_monitor
      POSTGRES_USER: api_monitor
      POSTGRES_PASSWORD: change_me_local

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_monitor -d api_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: